<!DOCTYPE html>
<html lang="zh-Hans"><head>
<meta charset="utf-8">
<title>Smalltify · 设备</title>
<script src="9cd24099-3b47-471a-b306-94ef3088433f"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div role="dialog" aria-label="播放设备" style="width: 360px; height: 560px; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: {{t.pop}}; border: 1px solid {{t.border}}; border-radius: 16px; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; font-size: 13px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
<h2 style="margin: 0; font-size: 13px; font-weight: 700">播放设备</h2>
<button type="button" aria-label="刷新设备列表" style="width: 26px; height: 26px; border: 0; border-radius: 13px; background: transparent; color: {{t.sub}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg aria-hidden="true" width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg></button>
</div>

<button type="button" sc-camel-on-click="{{pickMac}}" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; border: 0; border-radius: 10px; background: {{macBg}}; color: {{t.text}}; font: inherit; text-align: left; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
<span style="display: flex; flex-direction: column; gap: 1px; flex: 1 1 auto"><span style="font-weight: 600">在这台 Mac 播放</span><span style="font-size: 11px; color: {{t.sub}}">Smalltify · 本机播放器</span></span>
<sc-if value="{{macActive}}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="当前设备" width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
</button>

<div style="height: 1px; background: {{t.sep}}; margin: 2px 4px"></div>
<div style="font-size: 11px; font-weight: 600; color: {{t.sub}}; padding: 0 4px">账号下的其他设备</div>

<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{devices}}" as="d" hint-placeholder-count="5">
<button type="button" sc-camel-on-click="{{d.pick}}" disabled="{{d.disabled}}" style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 12px; border: 0; border-radius: 10px; background: {{d.bg}}; color: {{d.fg}}; font: inherit; text-align: left; cursor: {{d.cursor}}">
<span aria-hidden="true" style="width: 20px; display: flex; justify-content: center; color: {{d.icon}}">
<sc-if value="{{d.isSpeaker}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="2"></rect><circle cx="12" cy="14" r="3"></circle><circle cx="12" cy="7.5" r="1"></circle></svg></sc-if>
<sc-if value="{{d.isPhone}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2" width="10" height="20" rx="2.5"></rect><path d="M11 18h2"></path></svg></sc-if>
<sc-if value="{{d.isComputer}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="11" rx="1.5"></rect><path d="M2 19h20"></path></svg></sc-if>
<sc-if value="{{d.isTv}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8"></path></svg></sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 1px; flex: 1 1 auto; min-width: 0"><span style="font-weight: 500">{{d.label}}</span><span style="font-size: 11px; color: {{d.subColor}}">{{d.note}}</span></span>
<sc-if value="{{d.active}}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="当前设备" width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
<sc-if value="{{d.pending}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: {{t.sub}}">等待确认…</span></sc-if>
</button>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; gap: 8px; padding: 10px 12px; border-radius: 10px; background: {{t.note}}; font-size: 11px; line-height: 16px; color: {{t.sub}}">
<svg aria-hidden="true" width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
<span>在其他设备播放时为远程控制，状态约每 5 秒更新。灰色设备不能从这里控制。</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1DB954&quot;},&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:560}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 'living', pending: '' };
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  switchTo(id) {
    if (id === this.state.active) return;
    this.setState({ pending: id });
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.setState({ active: id, pending: '' }), 1800);
  }
  renderVals() {
    const d = this.props.dark ?? false;
    const accent = this.props.accent ?? '#1DB954';
    const t = d
      ? { pop: 'rgba(40,40,42,0.96)', border: 'rgba(255,255,255,0.10)', text: '#F5F5F7', sub: '#A1A1A6', dim: '#6C6C70', sep: 'rgba(255,255,255,0.08)', sel: 'rgba(29,185,84,0.22)', note: 'rgba(255,255,255,0.05)' }
      : { pop: 'rgba(250,250,252,0.97)', border: 'rgba(0,0,0,0.10)', text: '#1D1D1F', sub: '#6E6E73', dim: '#8E8E93', sep: 'rgba(0,0,0,0.07)', sel: 'rgba(29,185,84,0.14)', note: 'rgba(0,0,0,0.035)' };
    const list = [
      { id: 'living', label: '客厅音箱', kind: 'speaker', note: '音箱' },
      { id: 'phone', label: 'iPhone', kind: 'phone', note: '手机' },
      { id: 'study', label: '书房电脑', kind: 'computer', note: '电脑' },
      { id: 'tv', label: '卧室电视', kind: 'tv', note: '此设备不支持远程控制', restricted: true },
      { id: 'car', label: '车载音响', kind: 'speaker', note: '受限设备：只能在设备本身上操作', restricted: true }
    ];
    const active = this.state.active;
    const pending = this.state.pending;
    return {
      t: t, accent: accent,
      macActive: active === 'mac',
      macBg: active === 'mac' ? t.sel : 'transparent',
      pickMac: () => this.switchTo('mac'),
      devices: list.map((x) => {
        const on = x.id === active;
        const r = !!x.restricted;
        return {
          label: x.label,
          note: on ? '正在播放 · ' + x.note : (x.id === pending ? '正在切换…' : x.note),
          active: on, pending: x.id === pending,
          isSpeaker: x.kind === 'speaker', isPhone: x.kind === 'phone', isComputer: x.kind === 'computer', isTv: x.kind === 'tv',
          disabled: r,
          bg: on ? t.sel : 'transparent',
          fg: r ? t.dim : t.text,
          icon: r ? t.dim : (on ? accent : t.sub),
          subColor: t.sub,
          cursor: r ? 'default' : 'pointer',
          pick: () => { if (!r) this.switchTo(x.id); }
        };
      })
    };
  }
}
</script>


</body></html>
