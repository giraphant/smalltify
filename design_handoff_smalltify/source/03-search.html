<!DOCTYPE html>
<html lang="zh-Hans"><head>
<meta charset="utf-8">
<title>Smalltify · 搜索</title>
<script src="4b151203-3647-46b2-bde4-23269a1a1133"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 100%; min-height: 800px; display: flex; flex-direction: column; background: {{t.win}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; font-size: 13px">
<div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; min-height: 0">
<div style="flex: 1 1 220px; margin: 8px; border-radius: 16px; background: {{t.panel}}; border: 1px solid {{t.panelBorder}}; box-shadow: {{t.panelShadow}}; display: flex">
<dc-import name="Sidebar" dark="{{dark}}" accent="{{accent}}" active="none" hint-size="100%,704px"></dc-import>
</div>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="padding-top: 8px">
<dc-import name="Toolbar" dark="{{dark}}" heading="搜索「潮汐」" subheading="" query="潮汐" can-back="{{ true }}" hint-size="100%,52px"></dc-import>
</div>

<div style="padding: 8px 24px 6px 16px">
<div role="radiogroup" aria-label="搜索类型" style="display: inline-flex; padding: 2px; gap: 2px; border-radius: 9px; background: {{t.field}}">
<sc-for list="{{scopes}}" as="s" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{s.checked}}" sc-camel-on-click="{{s.pick}}" style="height: 24px; padding: 0 14px; border: 0; border-radius: 7px; background: {{s.bg}}; box-shadow: {{s.shadow}}; color: {{t.text}}; font: inherit; font-size: 12px; font-weight: {{s.weight}}; cursor: pointer">{{s.label}}</button>
</sc-for>
</div>
</div>

<div style="flex: 1 1 auto; overflow: auto; padding: 10px 24px 24px 16px; display: flex; flex-direction: column; gap: 26px">

<sc-if value="{{showSongs}}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-size: 15px; font-weight: 700">歌曲</h2><sc-if value="{{isAll}}" hint-placeholder-val="{{ true }}"><button type="button" sc-camel-on-click="{{goSongs}}" style="border: 0; background: transparent; padding: 0; font: inherit; font-size: 12px; color: {{t.sub}}; cursor: pointer">显示全部 ›</button></sc-if></div>
<sc-for list="{{songs}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px; border-radius: 8px; background: {{r.bg}}">
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 5px; background: {{r.cover}}; display: block; flex: none"></span>
<span style="display: flex; flex-direction: column; gap: 1px; flex: 1 1 auto; min-width: 0"><span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="font-size: 12px; color: {{t.sub}}"><a href="Artist.dc.html">{{r.artist}}</a> · <a href="Album.dc.html">{{r.album}}</a></span></span>
<span style="color: {{t.sub}}; font-variant-numeric: tabular-nums">{{r.time}}</span>
</div>
</sc-for>
</section>
</sc-if>

<sc-if value="{{showArtists}}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-size: 15px; font-weight: 700">歌手</h2><sc-if value="{{isAll}}" hint-placeholder-val="{{ true }}"><button type="button" sc-camel-on-click="{{goArtists}}" style="border: 0; background: transparent; padding: 0; font: inherit; font-size: 12px; color: {{t.sub}}; cursor: pointer">显示全部 ›</button></sc-if></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 16px">
<sc-for list="{{artists}}" as="a" hint-placeholder-count="4">
<a href="Artist.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center"><span aria-hidden="true" style="width: 80px; height: 80px; border-radius: 40px; background: {{a.bg}}; display: block"></span><span style="font-size: 12px; font-weight: 500">{{a.label}}</span></a>
</sc-for>
</div>
</section>
</sc-if>

<sc-if value="{{showAlbums}}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-size: 15px; font-weight: 700">专辑</h2><sc-if value="{{isAll}}" hint-placeholder-val="{{ true }}"><button type="button" sc-camel-on-click="{{goAlbums}}" style="border: 0; background: transparent; padding: 0; font: inherit; font-size: 12px; color: {{t.sub}}; cursor: pointer">显示全部 ›</button></sc-if></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 18px">
<sc-for list="{{albums}}" as="c" hint-placeholder-count="5">
<a href="Album.dc.html" style="display: flex; flex-direction: column; gap: 6px"><span aria-hidden="true" style="aspect-ratio: 1 / 1; border-radius: 8px; background: {{c.bg}}; display: block"></span><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 600">{{c.label}}</span><span style="font-size: 12px; color: {{t.sub}}">{{c.sub}}</span></span></a>
</sc-for>
</div>
</section>
</sc-if>

<sc-if value="{{showPlaylists}}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-size: 15px; font-weight: 700">歌单</h2><sc-if value="{{isAll}}" hint-placeholder-val="{{ true }}"><button type="button" sc-camel-on-click="{{goPlaylists}}" style="border: 0; background: transparent; padding: 0; font: inherit; font-size: 12px; color: {{t.sub}}; cursor: pointer">显示全部 ›</button></sc-if></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 18px">
<sc-for list="{{playlists}}" as="c" hint-placeholder-count="4">
<a href="Playlist.dc.html" style="display: flex; flex-direction: column; gap: 6px"><span aria-hidden="true" style="aspect-ratio: 1 / 1; border-radius: 8px; background: {{c.bg}}; display: block"></span><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 600">{{c.label}}</span><span style="font-size: 12px; color: {{t.sub}}">{{c.sub}}</span></span></a>
</sc-for>
</div>
</section>
</sc-if>

<sc-if value="{{single}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: center"><button type="button" style="height: 28px; padding: 0 14px; border: 1px solid {{t.sep}}; border-radius: 14px; background: transparent; color: {{t.text}}; font: inherit; font-size: 12px; cursor: pointer">加载更多 10 条</button></div>
</sc-if>
</div>
</main>
</div>

<div style="border-top: 1px solid {{t.sep}}; background: {{t.bar}}">
<dc-import name="PlayerBar" dark="{{dark}}" accent="{{accent}}" hint-size="100%,64px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1DB954&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { scope: '全部' };
  }
  renderVals() {
    const d = this.props.dark ?? false;
    const accent = this.props.accent ?? '#1DB954';
    const t = d
      ? { win: '#1E1E1E', panel: 'rgba(44,44,46,0.80)', panelBorder: 'rgba(255,255,255,0.09)', panelShadow: '0 2px 10px rgba(0,0,0,0.35)', text: '#F5F5F7', sub: '#A1A1A6', sep: 'rgba(255,255,255,0.10)', zebra: 'rgba(255,255,255,0.025)', bar: 'rgba(32,32,34,0.94)', field: 'rgba(255,255,255,0.08)', pill: '#48484A' }
      : { win: '#FFFFFF', panel: 'rgba(244,244,247,0.82)', panelBorder: 'rgba(0,0,0,0.06)', panelShadow: '0 2px 10px rgba(0,0,0,0.06)', text: '#1D1D1F', sub: '#6E6E73', sep: 'rgba(0,0,0,0.10)', zebra: 'rgba(0,0,0,0.022)', bar: 'rgba(250,250,252,0.94)', field: 'rgba(0,0,0,0.05)', pill: '#FFFFFF' };
    const scope = this.state.scope;
    const all = scope === '全部';
    const set = (s) => () => this.setState({ scope: s });
    const songsAll = [
      ['潮汐电台', '马洛·韦尔', '潮汐电台', '3:58', '#3A5A78'],
      ['退潮之后', '索尔', '周日慢板', '4:02', '#8C4A6B'],
      ['潮汐表', '鹪鹩乐队', '玻璃温室', '3:31', '#7A8F9E'],
      ['大潮', '艾达·布雷克', '北方静电', '5:14', '#2E2A3A'],
      ['潮间带', '林间录音', '散步', '2:47', '#2F6B5B'],
      ['涨潮（现场版）', '马洛·韦尔', '潮汐电台（现场）', '4:33', '#3A5A78']
    ];
    const songs = (all ? songsAll.slice(0, 4) : songsAll).map((s, i) => ({ title: s[0], artist: s[1], album: s[2], time: s[3], cover: s[4], bg: i % 2 === 1 ? t.zebra : 'transparent' }));
    return {
      t: t, dark: d, accent: accent,
      scopes: ['全部', '歌曲', '歌手', '专辑', '歌单'].map((l) => {
        const on = l === scope;
        return { label: l, checked: on ? 'true' : 'false', bg: on ? t.pill : 'transparent', shadow: on ? '0 1px 2px rgba(0,0,0,0.12)' : 'none', weight: on ? '600' : '400', pick: set(l) };
      }),
      isAll: all, single: !all,
      showSongs: all || scope === '歌曲',
      showArtists: all || scope === '歌手',
      showAlbums: all || scope === '专辑',
      showPlaylists: all || scope === '歌单',
      goSongs: set('歌曲'), goArtists: set('歌手'), goAlbums: set('专辑'), goPlaylists: set('歌单'),
      songs: songs,
      artists: [{ label: '潮汐乐团', bg: '#3A5A78' }, { label: '马洛·韦尔', bg: '#1F3B4D' }, { label: '[歌手名]', bg: '#7A8F9E' }, { label: '[歌手名]', bg: '#2F6B5B' }],
      albums: [
        { label: '潮汐电台', sub: '马洛·韦尔 · 2024', bg: '#3A5A78' },
        { label: '潮汐电台（现场）', sub: '马洛·韦尔 · 2025', bg: '#1F3B4D' },
        { label: '潮汐与月', sub: '[歌手名] · 2019', bg: '#B5532E' },
        { label: '[专辑名]', sub: '[歌手名] · [年份]', bg: '#7A8F9E' },
        { label: '[专辑名]', sub: '[歌手名] · [年份]', bg: '#C28A2C' }
      ],
      playlists: [
        { label: '听潮', sub: '[创建者]', bg: '#2F6B5B' },
        { label: '海边的周末', sub: '[创建者]', bg: '#C2185B' },
        { label: '[歌单名]', sub: '[创建者]', bg: '#5E40BE' },
        { label: '[歌单名]', sub: '[创建者]', bg: '#8C4A6B' }
      ]
    };
  }
}
</script>


</body></html>
