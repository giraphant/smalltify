<!DOCTYPE html>
<html lang="zh-Hans"><head>
<meta charset="utf-8">
<title>Smalltify · 别人的歌单</title>
<script src="12c44f3c-4a2f-4afa-ad61-bb409ec38d7d"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 100%; min-height: 800px; display: flex; flex-direction: column; background: {{t.win}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; font-size: 13px">
<div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; min-height: 0">
<div style="flex: 1 1 220px; margin: 8px; border-radius: 16px; background: {{t.panel}}; border: 1px solid {{t.panelBorder}}; box-shadow: {{t.panelShadow}}; display: flex">
<dc-import name="Sidebar" dark="{{dark}}" accent="{{accent}}" active="playlists" hint-size="100%,704px"></dc-import>
</div>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="padding-top: 8px">
<dc-import name="Toolbar" dark="{{dark}}" heading="海边的周末" subheading="歌单" can-back="{{ true }}" hint-size="100%,52px"></dc-import>
</div>

<div style="flex: 1 1 auto; overflow: auto; padding: 14px 24px 24px 24px; display: flex; flex-direction: column; gap: 28px">
<section style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 22px">
<div aria-hidden="true" style="width: 176px; height: 176px; flex: none; border-radius: 10px; background: #C2185B; box-shadow: 0 10px 28px rgba(0,0,0,0.18)"></div>
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 300px; min-width: 0">
<div style="font-size: 12px; color: {{t.sub}}">歌单 · 由 [创建者] 创建</div>
<h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 700">海边的周末</h1>
<p style="margin: 0; font-size: 13px; line-height: 19px; color: {{t.sub}}; max-width: 560px">[歌单简介：来自 Spotify 的描述文字，最多显示两行，超出部分截断…]</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px">
<button type="button" sc-camel-on-click="{{play}}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 16px; border: 0; border-radius: 15px; background: {{accent}}; color: #000000; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="12" height="12" sc-camel-view-box="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"></path></svg>播放整张</button>
<button type="button" sc-camel-on-click="{{save}}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px; border: 1px solid {{t.glassBorder}}; border-radius: 15px; background: {{t.glass}}; color: {{t.text}}; font: inherit; font-size: 13px; cursor: pointer"><svg aria-hidden="true" width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>{{saveLabel}}</button>
</div>
</div>
</section>

<section aria-label="曲目" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; border: 1px dashed {{t.sep}}; border-radius: 14px; padding: 40px 24px; min-height: 260px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; max-width: 380px">
<svg aria-hidden="true" width="28" height="28" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{t.sub}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<div style="font-size: 15px; font-weight: 600">看不到这个歌单的曲目</div>
<div style="font-size: 13px; line-height: 19px; color: {{t.sub}}">Spotify 只向第三方应用开放你创建或协作的歌单曲目。整张播放不受影响。</div>
</div>
</section>
</div>
</main>
</div>

<div style="border-top: 1px solid {{t.sep}}; background: {{t.bar}}">
<dc-import name="PlayerBar" dark="{{dark}}" accent="{{accent}}" hint-size="100%,64px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1DB954&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { saved: false };
  }
  renderVals() {
    const d = this.props.dark ?? false;
    const accent = this.props.accent ?? '#1DB954';
    const t = d
      ? { win: '#1E1E1E', panel: 'rgba(44,44,46,0.80)', panelBorder: 'rgba(255,255,255,0.09)', panelShadow: '0 2px 10px rgba(0,0,0,0.35)', text: '#F5F5F7', sub: '#A1A1A6', sep: 'rgba(255,255,255,0.16)', bar: 'rgba(32,32,34,0.94)', glass: 'rgba(58,58,60,0.62)', glassBorder: 'rgba(255,255,255,0.12)' }
      : { win: '#FFFFFF', panel: 'rgba(244,244,247,0.82)', panelBorder: 'rgba(0,0,0,0.06)', panelShadow: '0 2px 10px rgba(0,0,0,0.06)', text: '#1D1D1F', sub: '#6E6E73', sep: 'rgba(0,0,0,0.16)', bar: 'rgba(250,250,252,0.94)', glass: 'rgba(255,255,255,0.72)', glassBorder: 'rgba(0,0,0,0.10)' };
    return {
      t: t, dark: d, accent: accent,
      play: () => {},
      saveLabel: this.state.saved ? '已在常用歌单' : '存到常用歌单',
      save: () => this.setState({ saved: true })
    };
  }
}
</script>


</body></html>
