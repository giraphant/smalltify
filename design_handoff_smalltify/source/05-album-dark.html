<!DOCTYPE html>
<html lang="zh-Hans"><head>
<meta charset="utf-8">
<title>Smalltify · 专辑详情</title>
<script src="1cfeeb72-1ffa-4133-b297-6ffa9821e12a"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 100%; min-height: 800px; display: flex; flex-direction: column; background: {{t.win}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; font-size: 13px">
<div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; min-height: 0">
<div style="flex: 1 1 220px; margin: 8px; border-radius: 16px; background: {{t.panel}}; border: 1px solid {{t.panelBorder}}; box-shadow: {{t.panelShadow}}; display: flex">
<dc-import name="Sidebar" dark="{{dark}}" accent="{{accent}}" active="albums" hint-size="100%,704px"></dc-import>
</div>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="padding-top: 8px">
<dc-import name="Toolbar" dark="{{dark}}" heading="潮汐电台" subheading="专辑" can-back="{{ true }}" can-forward="{{ true }}" hint-size="100%,52px"></dc-import>
</div>

<div style="flex: 1 1 auto; overflow: auto; padding: 14px 24px 20px 16px; display: flex; flex-direction: column; gap: 20px">
<section style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 22px; padding-left: 8px">
<div aria-hidden="true" style="width: 176px; height: 176px; flex: none; border-radius: 10px; background: #3A5A78; box-shadow: 0 10px 28px rgba(0,0,0,0.35)"></div>
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 300px; min-width: 0">
<div style="font-size: 12px; color: {{t.sub}}">专辑</div>
<h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 700">潮汐电台</h1>
<div style="font-size: 13px; color: {{t.sub}}"><a href="Artist.dc.html" style="color: {{t.text}}; font-weight: 600">马洛·韦尔</a> · 2024 · 10 首</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px">
<button type="button" sc-camel-on-click="{{playAll}}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 16px; border: 0; border-radius: 15px; background: {{accent}}; color: #000000; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="12" height="12" sc-camel-view-box="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"></path></svg>播放</button>
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px; border: 1px solid {{t.glassBorder}}; border-radius: 15px; background: {{t.glass}}; color: {{t.text}}; font: inherit; font-size: 13px; cursor: pointer"><svg aria-hidden="true" width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5a4 4 0 0 1 3.3 1.7l4.4 6.6A4 4 0 0 0 17.5 17H21"></path><path d="M3 17h3.5a4 4 0 0 0 3.3-1.7l.7-1M14.2 8.7A4 4 0 0 1 17.5 7H21"></path><path d="m18 4 3 3-3 3M18 14l3 3-3 3"></path></svg>随机播放</button>
<button type="button" aria-label="收藏专辑" style="width: 30px; height: 30px; border: 1px solid {{t.glassBorder}}; border-radius: 15px; background: {{t.glass}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg aria-hidden="true" width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
<button type="button" aria-label="更多" style="width: 30px; height: 30px; border: 1px solid {{t.glassBorder}}; border-radius: 15px; background: {{t.glass}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg aria-hidden="true" width="14" height="14" sc-camel-view-box="0 0 24 24"><circle cx="5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="19" cy="12" r="1.7" fill="currentColor"></circle></svg></button>
</div>
</div>
</section>

<div style="display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px; height: 26px; padding: 0 8px; font-size: 11px; color: {{t.sub}}; border-bottom: 1px solid {{t.sep}}"><span style="width: 30px; text-align: center">#</span><span style="flex: 1 1 auto">歌名</span><span style="width: 48px; text-align: right">时长</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div sc-camel-on-double-click="{{r.play}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 8px; border-radius: 8px; background: {{r.bg}}">
<button type="button" aria-label="播放 {{r.title}}" sc-camel-on-click="{{r.play}}" style="width: 30px; height: 30px; border: 0; border-radius: 15px; background: transparent; color: {{t.sub}}; font: inherit; font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
<sc-if value="{{r.isPlaying}}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="正在播放" width="13" height="13" sc-camel-view-box="0 0 24 24"><rect x="3" y="9" width="4" height="12" rx="1" fill="{{accent}}"></rect><rect x="10" y="3" width="4" height="18" rx="1" fill="{{accent}}"></rect><rect x="17" y="12" width="4" height="9" rx="1" fill="{{accent}}"></rect></svg></sc-if>
<sc-if value="{{r.notPlaying}}" hint-placeholder-val="{{ true }}">{{r.n}}</sc-if>
</button>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-weight: {{r.weight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
<sc-if value="{{r.hasFeat}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: {{t.sub}}"><a href="Artist.dc.html">马洛·韦尔</a>、<a href="Artist.dc.html">{{r.feat}}</a></span></sc-if>
</span>
<span style="width: 48px; text-align: right; color: {{t.sub}}; font-variant-numeric: tabular-nums">{{r.time}}</span>
</div>
</sc-for>
</div>
<div style="font-size: 12px; color: {{t.sub}}; padding-left: 8px">2024 · 10 首，39 分钟</div>
</div>
</main>
</div>

<div style="border-top: 1px solid {{t.sep}}; background: {{t.bar}}">
<dc-import name="PlayerBar" dark="{{dark}}" accent="{{accent}}" hint-size="100%,64px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1DB954&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playingId: 0, selected: 3 };
  }
  renderVals() {
    const d = this.props.dark ?? true;
    const accent = this.props.accent ?? '#1DB954';
    const t = d
      ? { win: '#1E1E1E', panel: 'rgba(44,44,46,0.80)', panelBorder: 'rgba(255,255,255,0.09)', panelShadow: '0 2px 10px rgba(0,0,0,0.35)', text: '#F5F5F7', sub: '#A1A1A6', sep: 'rgba(255,255,255,0.08)', sel: 'rgba(29,185,84,0.22)', zebra: 'rgba(255,255,255,0.025)', bar: 'rgba(32,32,34,0.94)', glass: 'rgba(58,58,60,0.62)', glassBorder: 'rgba(255,255,255,0.12)' }
      : { win: '#FFFFFF', panel: 'rgba(244,244,247,0.82)', panelBorder: 'rgba(0,0,0,0.06)', panelShadow: '0 2px 10px rgba(0,0,0,0.06)', text: '#1D1D1F', sub: '#6E6E73', sep: 'rgba(0,0,0,0.07)', sel: 'rgba(29,185,84,0.14)', zebra: 'rgba(0,0,0,0.022)', bar: 'rgba(250,250,252,0.94)', glass: 'rgba(255,255,255,0.72)', glassBorder: 'rgba(0,0,0,0.08)' };
    const data = [
      ['潮汐电台', '3:58'], ['港口灯火', '3:41'], ['盐与静电', '4:05'], ['凌晨的渡轮', '3:12', '索尔'],
      ['玻璃浮球', '4:27'], ['暗流', '3:49'], ['长堤', '5:02'], ['造雾机', '3:20'],
      ['信号火', '4:11', '艾达·布雷克'], ['靠岸', '3:36']
    ];
    return {
      t: t, dark: d, accent: accent,
      playAll: () => this.setState({ playingId: 0 }),
      rows: data.map((r, i) => {
        const p = i === this.state.playingId;
        return {
          n: i + 1, title: r[0], time: r[1], feat: r[2] || '', hasFeat: !!r[2],
          isPlaying: p, notPlaying: !p, weight: p ? '600' : '400',
          bg: i === this.state.selected ? t.sel : (i % 2 === 1 ? t.zebra : 'transparent'),
          play: () => this.setState({ playingId: i, selected: i })
        };
      })
    };
  }
}
</script>


</body></html>
