<!DOCTYPE html>
<html lang="zh-Hans"><head>
<meta charset="utf-8">
<title>Smalltify · 喜欢的歌曲</title>
<script src="b12b828a-ad3f-4061-89f1-df16a3f57cd8"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 100%; min-height: 800px; display: flex; flex-direction: column; background: {{t.win}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; font-size: 13px">
<div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; min-height: 0">
<div style="flex: 1 1 220px; margin: 8px; border-radius: 16px; background: {{t.panel}}; border: 1px solid {{t.panelBorder}}; box-shadow: {{t.panelShadow}}; display: flex">
<dc-import name="Sidebar" dark="{{dark}}" accent="{{accent}}" active="liked" hint-size="100%,704px"></dc-import>
</div>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; position: relative">
<div style="padding-top: 8px">
<dc-import name="Toolbar" dark="{{dark}}" heading="喜欢的歌曲" subheading="[总数] 首 · 已加载 50 首" can-back="{{ false }}" hint-size="100%,52px"></dc-import>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 24px 10px 16px">
<div style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: {{t.field}}; color: {{t.sub}}; width: 220px; box-sizing: border-box">
<svg aria-hidden="true" width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
<label for="flt" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">在列表中筛选</label>
<input id="flt" type="search" placeholder="在列表中筛选" style="flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 12px; color: {{t.text}}; outline: none">
</div>
<span style="flex: 1 1 auto"></span>
<button type="button" sc-camel-on-click="{{playAll}}" style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 14px; border: 0; border-radius: 14px; background: {{accent}}; color: #000000; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="11" height="11" sc-camel-view-box="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"></path></svg>播放</button>
</div>

<div style="flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 16px 8px">
<sc-raw-table style="width: 100%; min-width: 640px; border-collapse: separate; border-spacing: 0; table-layout: fixed">
<sc-raw-thead>
<sc-raw-tr style="text-align: left; font-size: 11px; color: {{t.sub}}">
<sc-raw-th scope="col" style="width: 40px; padding: 0 0 6px 10px; font-weight: 500; border-bottom: 1px solid {{t.sep}}">#</sc-raw-th>
<sc-raw-th scope="col" style="padding: 0 0 6px; font-weight: 500; border-bottom: 1px solid {{t.sep}}"><button type="button" style="border: 0; background: transparent; padding: 0; font: inherit; color: inherit; cursor: pointer">歌名</button></sc-raw-th>
<sc-raw-th scope="col" style="width: 20%; padding: 0 0 6px; font-weight: 500; border-bottom: 1px solid {{t.sep}}"><button type="button" style="border: 0; background: transparent; padding: 0; font: inherit; color: inherit; cursor: pointer">歌手</button></sc-raw-th>
<sc-raw-th scope="col" style="width: 20%; padding: 0 0 6px; font-weight: 500; border-bottom: 1px solid {{t.sep}}"><button type="button" style="border: 0; background: transparent; padding: 0; font: inherit; color: inherit; cursor: pointer">专辑</button></sc-raw-th>
<sc-raw-th scope="col" aria-sort="descending" style="width: 96px; padding: 0 0 6px; font-weight: 600; border-bottom: 1px solid {{t.sep}}; color: {{t.text}}"><button type="button" style="border: 0; background: transparent; padding: 0; font: inherit; color: inherit; cursor: pointer; display: flex; align-items: center; gap: 4px">添加时间<svg aria-hidden="true" width="9" height="9" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button></sc-raw-th>
<sc-raw-th scope="col" style="width: 56px; padding: 0 10px 6px 0; font-weight: 500; text-align: right; border-bottom: 1px solid {{t.sep}}"><button type="button" style="border: 0; background: transparent; padding: 0; font: inherit; color: inherit; cursor: pointer">时长</button></sc-raw-th>
</sc-raw-tr>
</sc-raw-thead>
<sc-raw-tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<sc-raw-tr sc-camel-on-click="{{r.select}}" sc-camel-on-double-click="{{r.play}}" style="background: {{r.bg}}">
<sc-raw-td style="height: 44px; padding: 0 0 0 4px; border-radius: 8px 0 0 8px">
<button type="button" aria-label="播放 {{r.title}}" sc-camel-on-click="{{r.play}}" style="width: 30px; height: 30px; border: 0; border-radius: 15px; background: transparent; color: {{t.sub}}; font: inherit; font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
<sc-if value="{{r.isPlaying}}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="正在播放" width="13" height="13" sc-camel-view-box="0 0 24 24"><rect x="3" y="9" width="4" height="12" rx="1" fill="{{accent}}"></rect><rect x="10" y="3" width="4" height="18" rx="1" fill="{{accent}}"></rect><rect x="17" y="12" width="4" height="9" rx="1" fill="{{accent}}"></rect></svg></sc-if>
<sc-if value="{{r.notPlaying}}" hint-placeholder-val="{{ true }}">{{r.n}}</sc-if>
</button>
</sc-raw-td>
<sc-raw-td style="padding: 0 12px 0 0">
<div style="display: flex; align-items: center; gap: 10px; min-width: 0">
<sc-if value="{{r.hasCover}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 5px; background: {{r.cover}}; display: block; flex: none"></span></sc-if>
<sc-if value="{{r.noCover}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 5px; background: {{t.field}}; color: {{t.sub}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="18" r="3"></circle><path d="M11 18V5l9-2v13"></path><circle cx="17" cy="16" r="3"></circle></svg></span></sc-if>
<span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: {{r.weight}}" title="{{r.title}}">{{r.title}}</span>
</div>
</sc-raw-td>
<sc-raw-td style="padding: 0 12px 0 0; color: {{t.sub}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">
<sc-for list="{{r.artists}}" as="a" hint-placeholder-count="1"><a href="Artist.dc.html">{{a.label}}</a>{{a.sep}}</sc-for>
</sc-raw-td>
<sc-raw-td style="padding: 0 12px 0 0; color: {{t.sub}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><a href="Album.dc.html">{{r.album}}</a></sc-raw-td>
<sc-raw-td style="padding: 0; color: {{t.sub}}; white-space: nowrap">{{r.added}}</sc-raw-td>
<sc-raw-td style="padding: 0 10px 0 0; color: {{t.sub}}; text-align: right; font-variant-numeric: tabular-nums; border-radius: 0 8px 8px 0">{{r.time}}</sc-raw-td>
</sc-raw-tr>
</sc-for>
</sc-raw-tbody>
</sc-raw-table>
<div style="display: flex; justify-content: center; padding: 14px 0 6px">
<button type="button" style="height: 28px; padding: 0 14px; border: 1px solid {{t.sep}}; border-radius: 14px; background: transparent; color: {{t.text}}; font: inherit; font-size: 12px; cursor: pointer">加载更多 50 首</button>
</div>
</div>

<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ true }}">
<div role="menu" aria-label="歌曲操作" style="position: absolute; left: 300px; top: 262px; width: 232px; padding: 5px; border-radius: 10px; background: {{t.menu}}; border: 1px solid {{t.panelBorder}}; box-shadow: 0 10px 32px rgba(0,0,0,0.22); display: flex; flex-direction: column; gap: 1px; z-index: 5">
<button type="button" role="menuitem" sc-camel-on-click="{{menuPlay}}" style="display: flex; justify-content: space-between; height: 26px; align-items: center; padding: 0 10px; border: 0; border-radius: 6px; background: {{t.sel}}; color: {{t.text}}; font: inherit; font-size: 13px; text-align: left; cursor: pointer"><span>播放</span><span style="color: {{t.sub}}; font-size: 12px">↩</span></button>
<button type="button" role="menuitem" sc-camel-on-click="{{menuQueue}}" style="display: flex; height: 26px; align-items: center; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13px; text-align: left; cursor: pointer">加入队列</button>
<div role="separator" style="height: 1px; background: {{t.sep}}; margin: 4px 8px"></div>
<button type="button" role="menuitem" aria-haspopup="menu" style="display: flex; justify-content: space-between; height: 26px; align-items: center; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13px; text-align: left; cursor: pointer"><span>去歌手页</span><span style="color: {{t.sub}}">›</span></button>
<button type="button" role="menuitem" style="display: flex; height: 26px; align-items: center; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13px; text-align: left; cursor: pointer">去专辑页</button>
<div role="separator" style="height: 1px; background: {{t.sep}}; margin: 4px 8px"></div>
<button type="button" role="menuitem" style="display: flex; height: 26px; align-items: center; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13px; text-align: left; cursor: pointer">复制链接</button>
<button type="button" role="menuitem" style="display: flex; height: 26px; align-items: center; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13px; text-align: left; cursor: pointer">在 Spotify 中打开</button>
</div>
<div role="menu" aria-label="选择歌手" style="position: absolute; left: 536px; top: 330px; width: 160px; padding: 5px; border-radius: 10px; background: {{t.menu}}; border: 1px solid {{t.panelBorder}}; box-shadow: 0 10px 32px rgba(0,0,0,0.22); display: flex; flex-direction: column; gap: 1px; z-index: 6">
<a href="Artist.dc.html" role="menuitem" style="display: flex; height: 26px; align-items: center; padding: 0 10px; border-radius: 6px; background: {{t.sel}}; color: {{t.text}}; font-size: 13px">马洛·韦尔</a>
<a href="Artist.dc.html" role="menuitem" style="display: flex; height: 26px; align-items: center; padding: 0 10px; border-radius: 6px; color: {{t.text}}; font-size: 13px">索尔</a>
</div>
</sc-if>

<sc-if value="{{toastOn}}" hint-placeholder-val="{{ true }}">
<div role="status" style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 17px; background: {{t.toast}}; color: {{t.toastText}}; box-shadow: 0 6px 20px rgba(0,0,0,0.2); font-size: 13px; white-space: nowrap; z-index: 7">
<svg aria-hidden="true" width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg>{{toast}}
</div>
</sc-if>
</main>
</div>

<div style="border-top: 1px solid {{t.sep}}; background: {{t.bar}}">
<dc-import name="PlayerBar" dark="{{dark}}" accent="{{accent}}" hint-size="100%,64px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1DB954&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selected: 2, playingId: 0, menuOpen: true, toast: '已加入队列' };
  }
  flash(msg) {
    this.setState({ toast: msg, menuOpen: false });
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.setState({ toast: '' }), 2500);
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  renderVals() {
    const d = this.props.dark ?? false;
    const accent = this.props.accent ?? '#1DB954';
    const t = d
      ? { win: '#1E1E1E', panel: 'rgba(44,44,46,0.80)', panelBorder: 'rgba(255,255,255,0.09)', panelShadow: '0 2px 10px rgba(0,0,0,0.35)', text: '#F5F5F7', sub: '#A1A1A6', sep: 'rgba(255,255,255,0.08)', sel: 'rgba(29,185,84,0.22)', zebra: 'rgba(255,255,255,0.025)', bar: 'rgba(32,32,34,0.94)', field: 'rgba(255,255,255,0.07)', menu: '#2C2C2E', toast: '#F5F5F7', toastText: '#1D1D1F' }
      : { win: '#FFFFFF', panel: 'rgba(244,244,247,0.82)', panelBorder: 'rgba(0,0,0,0.06)', panelShadow: '0 2px 10px rgba(0,0,0,0.06)', text: '#1D1D1F', sub: '#6E6E73', sep: 'rgba(0,0,0,0.07)', sel: 'rgba(29,185,84,0.14)', zebra: 'rgba(0,0,0,0.022)', bar: 'rgba(250,250,252,0.94)', field: 'rgba(0,0,0,0.05)', menu: '#FFFFFF', toast: '#1D1D1F', toastText: '#FFFFFF' };
    const data = [
      ['潮汐电台', [['马洛·韦尔']], '潮汐电台', '3 天前', '3:58', '#3A5A78'],
      ['纸灯笼', [['朱妮珀·黑尔']], '纸灯笼', '3 天前', '4:12', '#B5532E'],
      ['凌晨的渡轮', [['马洛·韦尔'], ['索尔']], '潮汐电台', '1 周前', '3:12', '#3A5A78'],
      ['北方静电', [['艾达·布雷克']], '北方静电', '2 周前', '4:40', '#2E2A3A'],
      ['一首名字非常非常长的歌，长到在任何列宽下都必须截断显示（Live at Harbour Hall · 2024 Remaster）', [['鹪鹩乐队']], '玻璃温室（豪华版）', '2026/9/18', '6:21', '#7A8F9E'],
      ['雾中散步', [['林间录音']], '散步', '2026/9/2', '2:58', null],
      ['灯塔', [['朱妮珀·黑尔']], '纸灯笼', '2026/8/30', '3:47', '#B5532E'],
      ['玻璃浮球', [['马洛·韦尔']], '潮汐电台', '2026/8/21', '4:27', '#3A5A78'],
      ['周日慢板', [['索尔'], ['艾达·布雷克'], ['林间录音']], '周日慢板', '2026/8/14', '5:05', '#8C4A6B'],
      ['信号火', [['马洛·韦尔']], '潮汐电台', '2026/8/2', '4:11', '#3A5A78']
    ];
    const rows = data.map((r, i) => {
      const playingRow = i === this.state.playingId;
      const sel = i === this.state.selected;
      return {
        n: i + 1,
        title: r[0],
        artists: r[1].map((a, j) => ({ label: a[0], sep: j < r[1].length - 1 ? '、' : '' })),
        album: r[2], added: r[3], time: r[4],
        cover: r[5] || 'transparent',
        hasCover: !!r[5], noCover: !r[5],
        isPlaying: playingRow, notPlaying: !playingRow,
        weight: playingRow ? '600' : '400',
        bg: sel ? t.sel : (i % 2 === 1 ? t.zebra : 'transparent'),
        select: () => this.setState({ selected: i, menuOpen: false }),
        play: () => this.setState({ playingId: i, selected: i, menuOpen: false })
      };
    });
    return {
      t: t, dark: d, accent: accent, rows: rows,
      menuOpen: this.state.menuOpen,
      menuPlay: () => this.setState({ playingId: this.state.selected, menuOpen: false }),
      menuQueue: () => this.flash('已加入队列'),
      playAll: () => this.setState({ playingId: 0 }),
      toastOn: !!this.state.toast,
      toast: this.state.toast
    };
  }
}
</script>


</body></html>
